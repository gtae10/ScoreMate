plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ScoreMate'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
    // 웹 / REST API
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 화면 렌더링 (Thymeleaf)
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // JPA + MySQL
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // JSON 파싱 (KBO 일정 API 응답 처리용)
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // 로컬 개발용 .env 파일 로딩 (DB 비밀번호/JWT 시크릿을 코드/설정 파일에 평문으로 안 남기기 위함)
    // developmentOnly와 같은 이유로 운영 산출물(jar)에는 안 들어가지만, 테스트도 로컬 DB를
    // 그대로 쓰므로 testAndDevelopmentOnly로 bootRun/테스트 양쪽 다 .env를 읽게 한다.
    testAndDevelopmentOnly 'me.paulschwarz:springboot4-dotenv:5.1.0'

    // 크롤링
    implementation 'org.jsoup:jsoup:1.17.2'

    // 스케줄러는 spring-boot-starter 기본 포함 (별도 의존성 불필요, @EnableScheduling만 추가)

    // 인증 (예측 게임 + 랭킹이라 유저 관리 필수)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // 유효성 검증
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // 개발 편의
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

tasks.named('test') {
	useJUnitPlatform {
		// 실제 KBO 사이트로 네트워크 요청을 보내는 테스트는 @Tag("manual")을 붙여서
		// 평소 빌드/CI에서 제외한다. 확인이 필요할 때만 -PincludeManual로 포함해서 돌릴 것.
		if (!project.hasProperty('includeManual')) {
			excludeTags 'manual'
		}
	}
}
