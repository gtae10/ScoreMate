spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/scoremate?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:scoremate}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

logging:
  level:
    ScoreMate.ScoreMate: debug
