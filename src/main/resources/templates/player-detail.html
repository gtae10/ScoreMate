<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
  <title th:text="${player.name} + ' - ScoreMate'">선수 - ScoreMate</title>
</head>
<body>

<div class="header-stack">
  <div class="topbar">
    <a class="logo" th:href="@{/}">
      <div class="logo-mark">SM</div>
      ScoreMate
    </a>

    <nav class="primary-nav">
      <a th:href="@{/}">경기</a>
      <a th:href="@{/standings}">순위</a>
      <a class="active" th:href="@{/players}">선수</a>
      <a>즐겨찾기</a>
    </nav>

    <div class="top-actions">
      <div class="icon-btn" title="검색">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
    </div>
  </div>
</div>

<main>
  <div class="league-card">
    <div class="player-header">
      <div class="crest" th:style="'background:' + ${badgeColor}" th:text="${badgeCode}">SS</div>
      <div>
        <h1 th:text="${player.name}">선수명</h1>
        <div class="meta">
          <span th:text="${player.teamName}">팀</span> ·
          <span th:text="${isPitcher} ? '투수' : '타자'">타자</span>
          <span th:if="${player.backNumber != null}" th:text="' · #' + ${player.backNumber}"> · #0</span>
        </div>
      </div>
    </div>

    <table class="data-table" th:if="${!isPitcher}">
      <thead>
        <tr>
          <th>시즌</th><th>경기</th><th>타율</th><th>안타</th><th>홈런</th><th>타점</th>
          <th>출루율</th><th>장타율</th><th>OPS</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="r : ${records}">
          <td th:text="${r.season}">2026</td>
          <td th:text="${r.gamesPlayed}">0</td>
          <td th:text="${r.battingAverage}">-</td>
          <td th:text="${r.hits}">-</td>
          <td th:text="${r.homeRuns}">-</td>
          <td th:text="${r.rbi}">-</td>
          <td th:text="${r.onBasePercentage}">-</td>
          <td th:text="${r.sluggingPercentage}">-</td>
          <td th:text="${r.ops}">-</td>
        </tr>
      </tbody>
    </table>

    <table class="data-table" th:if="${isPitcher}">
      <thead>
        <tr>
          <th>시즌</th><th>경기</th><th>방어율</th><th>승</th><th>패</th><th>세이브</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="r : ${records}">
          <td th:text="${r.season}">2026</td>
          <td th:text="${r.gamesPlayed}">0</td>
          <td th:text="${r.era}">-</td>
          <td th:text="${r.wins}">-</td>
          <td th:text="${r.losses}">-</td>
          <td th:text="${r.saves}">-</td>
        </tr>
      </tbody>
    </table>

    <div th:if="${#lists.isEmpty(records)}" style="padding: 24px 20px; color: var(--text-faint);">
      아직 기록된 시즌 데이터가 없어요.
    </div>
  </div>
</main>

<div class="sport-nav">
  <div class="sport-nav-inner">
    <div class="sport-tab active">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M7 5.5C9 8 9 16 7 18.5M17 5.5C15 8 15 16 17 18.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      야구
    </div>
    <div class="sport-tab">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 8l3.5 2.5-1.3 4H9.8l-1.3-4L12 8z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 3.5v4.5M4.5 9l3.2 1.5M19.5 9l-3.2 1.5M8 19l1.8-4.5M16 19l-1.8-4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      축구
    </div>
  </div>
</div>

</body>
</html>
