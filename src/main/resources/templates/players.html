<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
  <title>ScoreMate - 선수</title>
</head>
<body>

<div class="header-stack">
  <div class="topbar">
    <a class="logo" th:href="@{/}">
      <div class="logo-mark">SM</div>
      ScoreMate
    </a>

    <nav class="primary-nav">
      <a th:href="@{/}">경기</a>
      <a th:href="@{/standings}">순위</a>
      <a class="active" th:href="@{/players}">선수</a>
      <a>즐겨찾기</a>
    </nav>

    <div class="top-actions">
      <div class="icon-btn" title="검색">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
    </div>
  </div>
</div>

<main>
  <form class="search-form" th:action="@{/players}" method="get">
    <input class="search-input" type="text" name="q" placeholder="선수 이름을 검색하세요 (예: 김도영)" th:value="${query}" />
    <button class="search-btn" type="submit">검색</button>
  </form>

  <div class="league-card">
    <div class="match-list">
      <a class="player-row" th:each="p : ${results}" th:href="@{/players/{id}(id=${p.id})}">
        <div class="player-row-left">
          <div class="player-name" th:text="${p.name}">선수명</div>
        </div>
        <div class="player-meta">
          <span th:text="${p.teamName}">팀</span> ·
          <span th:text="${p.position == 'PITCHER'} ? '투수' : '타자'">타자</span>
          <span th:if="${p.backNumber != null}" th:text="' · #' + ${p.backNumber}"> · #0</span>
        </div>
      </a>

      <div class="player-row" th:if="${searched and #lists.isEmpty(results)}">
        <div class="player-meta">검색 결과가 없어요.</div>
      </div>
      <div class="player-row" th:if="${!searched}">
        <div class="player-meta">선수 이름을 검색해보세요.</div>
      </div>
    </div>
  </div>
</main>

<div class="sport-nav">
  <div class="sport-nav-inner">
    <div class="sport-tab active">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M7 5.5C9 8 9 16 7 18.5M17 5.5C15 8 15 16 17 18.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      야구
    </div>
    <div class="sport-tab">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 8l3.5 2.5-1.3 4H9.8l-1.3-4L12 8z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 3.5v4.5M4.5 9l3.2 1.5M19.5 9l-3.2 1.5M8 19l1.8-4.5M16 19l-1.8-4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      축구
    </div>
  </div>
</div>

</body>
</html>
