<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
  <title>ScoreMate</title>
</head>
<body>

<div class="header-stack">
  <div class="topbar">
    <div class="logo">
      <div class="logo-mark">SM</div>
      ScoreMate
    </div>

    <nav class="primary-nav">
      <a class="active">경기</a>
      <a>순위</a>
      <a>선수</a>
      <a>즐겨찾기</a>
    </nav>

    <div class="top-actions">
      <div class="icon-btn" title="검색">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
    </div>
  </div>

  <div class="date-nav">
    <a class="arrow-btn" title="일주일 전" th:href="@{/(date=${prevWeekDate})}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>

    <div class="date-tabs">
      <a class="date-tab" th:each="tab : ${dateTabs}"
         th:classappend="${tab.active} ? ' active' : ''"
         th:href="@{/(date=${tab.dateParam})}">
        <span th:text="${tab.label}">오늘</span>
        <span class="sub" th:text="${tab.sub}">7.31</span>
      </a>
    </div>

    <a class="arrow-btn" title="일주일 후" th:href="@{/(date=${nextWeekDate})}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>

    <a th:if="${showTodayJump}" class="today-jump show" th:href="@{/(date=${todayDate})}">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      오늘로 이동
    </a>
  </div>
</div>

<main>
  <div class="league-card" id="kboCard">
    <div class="league-head" onclick="document.getElementById('kboCard').classList.toggle('collapsed')">
      <div class="league-head-left">
        <div class="league-badge">KBO</div>
        <div>
          <div class="league-name">KBO 리그</div>
          <div class="league-sub" th:text="${selectedDate} + ' 경기'">2026-07-31 경기</div>
        </div>
      </div>
      <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div class="match-list">
      <div class="match-row" th:each="match : ${matches}">
        <div class="status-badge"
             th:classappend="${match.live} ? ' live' : ''"
             th:text="${match.statusText}">
          종료
        </div>

        <div class="team home">
          <div class="crest" th:style="'background:' + ${match.homeColor}" th:text="${match.homeCode}">팀</div>
          <span th:text="${match.homeTeam}">홈팀</span>
        </div>

        <div class="score-box" th:if="${match.homeScore != null}">
          <span class="n" th:classappend="' ' + ${match.homeResult}" th:text="${match.homeScore}">0</span>
          <span class="dash">–</span>
          <span class="n" th:classappend="' ' + ${match.awayResult}" th:text="${match.awayScore}">0</span>
        </div>
        <div class="score-box" th:if="${match.homeScore == null}">
          <span class="dash">– : –</span>
        </div>

        <div class="team away">
          <div class="crest" th:style="'background:' + ${match.awayColor}" th:text="${match.awayCode}">팀</div>
          <span th:text="${match.awayTeam}">원정팀</span>
        </div>
      </div>

      <div class="match-row" th:if="${#lists.isEmpty(matches)}">
        <div class="league-sub" style="grid-column: 1 / -1; text-align:center; padding: 8px 0;">
          이 날짜엔 예정된 경기가 없어요.
        </div>
      </div>
    </div>
  </div>
</main>

<div class="sport-nav">
  <div class="sport-nav-inner">
    <div class="sport-tab active">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M7 5.5C9 8 9 16 7 18.5M17 5.5C15 8 15 16 17 18.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      야구
    </div>
    <div class="sport-tab">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 8l3.5 2.5-1.3 4H9.8l-1.3-4L12 8z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 3.5v4.5M4.5 9l3.2 1.5M19.5 9l-3.2 1.5M8 19l1.8-4.5M16 19l-1.8-4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      축구
    </div>
  </div>
</div>

</body>
</html>
