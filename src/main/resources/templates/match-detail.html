<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
  <title th:text="${match.awayTeam} + ' vs ' + ${match.homeTeam} + ' - ScoreMate'">경기 상세 - ScoreMate</title>
</head>
<body>

<div class="header-stack">
  <div class="topbar">
    <a class="logo" th:href="@{/}">
      <div class="logo-mark">SM</div>
      ScoreMate
    </a>

    <nav class="primary-nav">
      <a class="active" th:href="@{/}">경기</a>
      <a th:href="@{/standings}">순위</a>
      <a th:href="@{/players}">선수</a>
      <a>즐겨찾기</a>
    </nav>

    <div class="top-actions">
      <div class="icon-btn" title="검색">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
    </div>
  </div>
</div>

<main>
  <div class="league-card">
    <div class="league-head" style="cursor:default;">
      <div class="league-head-left">
        <div class="league-badge">KBO</div>
        <div>
          <div class="league-name" th:text="${statusText}">종료</div>
          <div class="league-sub" th:text="${#temporals.format(match.matchDate, 'yyyy-MM-dd')} + (${match.stadium} != null ? (' · ' + ${match.stadium}) : '')">2026-08-04 · 잠실</div>
        </div>
      </div>
    </div>

    <div class="match-hero">
      <div class="team-block">
        <div class="crest" th:style="'background:' + ${awayColor}" th:text="${awayCode}">AW</div>
        <div class="team-name" th:text="${match.awayTeam}">원정팀</div>
        <div class="pitcher" th:if="${awayPitcher != null}" th:text="'선발 투수: ' + ${awayPitcher}">선발 투수: -</div>
      </div>

      <div class="center">
        <div class="big-score" th:if="${match.awayScore != null}">
          <span th:text="${match.awayScore}">0</span>
          <span class="dash">–</span>
          <span th:text="${match.homeScore}">0</span>
        </div>
        <div class="big-score" th:if="${match.awayScore == null}">
          <span class="dash">– : –</span>
        </div>
        <div class="meta" th:if="${match.awayHits != null}">
          안타 <span th:text="${match.awayHits}">0</span> - <span th:text="${match.homeHits}">0</span>
          &nbsp;·&nbsp; 실책 <span th:text="${match.awayErrors}">0</span> - <span th:text="${match.homeErrors}">0</span>
        </div>
      </div>

      <div class="team-block">
        <div class="crest" th:style="'background:' + ${homeColor}" th:text="${homeCode}">HM</div>
        <div class="team-name" th:text="${match.homeTeam}">홈팀</div>
        <div class="pitcher" th:if="${homePitcher != null}" th:text="'선발 투수: ' + ${homePitcher}">선발 투수: -</div>
      </div>
    </div>

    <div class="live-panel" th:if="${isLive}">
      <h3 class="panel-title">실시간 중계</h3>
      <div class="live-panel-body">
        <div class="diamond-mini">
          <div class="count-board">
            <div class="count-row count-ball">
              <span class="count-label">B</span>
              <span class="dot" th:each="i : ${#numbers.sequence(1, 3)}" th:classappend="${i <= (liveBox.ballCount ?: 0)} ? ' on' : ''"></span>
            </div>
            <div class="count-row count-strike">
              <span class="count-label">S</span>
              <span class="dot" th:each="i : ${#numbers.sequence(1, 2)}" th:classappend="${i <= (liveBox.strikeCount ?: 0)} ? ' on' : ''"></span>
            </div>
            <div class="count-row count-out">
              <span class="count-label">O</span>
              <span class="dot" th:each="i : ${#numbers.sequence(1, 2)}" th:classappend="${i <= (liveBox.outCount ?: 0)} ? ' on' : ''"></span>
            </div>
          </div>

          <div class="base base-2b" th:classappend="${liveBox.runnerOnSecond} ? 'occupied' : ''"></div>
          <div class="base base-3b" th:classappend="${liveBox.runnerOnThird} ? 'occupied' : ''"></div>
          <div class="base base-1b" th:classappend="${liveBox.runnerOnFirst} ? 'occupied' : ''"></div>

          <div class="pos pos-lf"><span class="pos-label">좌익수</span><span class="pos-name" th:text="${liveBox.leftFielder} ?: '-'">-</span></div>
          <div class="pos pos-cf"><span class="pos-label">중견수</span><span class="pos-name" th:text="${liveBox.centerFielder} ?: '-'">-</span></div>
          <div class="pos pos-rf"><span class="pos-label">우익수</span><span class="pos-name" th:text="${liveBox.rightFielder} ?: '-'">-</span></div>
          <div class="pos pos-ss"><span class="pos-label">유격수</span><span class="pos-name" th:text="${liveBox.shortstop} ?: '-'">-</span></div>
          <div class="pos pos-2b"><span class="pos-label">2루수</span><span class="pos-name" th:text="${liveBox.secondBase} ?: '-'">-</span></div>
          <div class="pos pos-3b"><span class="pos-label">3루수</span><span class="pos-name" th:text="${liveBox.thirdBase} ?: '-'">-</span></div>
          <div class="pos pos-1b"><span class="pos-label">1루수</span><span class="pos-name" th:text="${liveBox.firstBase} ?: '-'">-</span></div>
          <div class="pos pos-c"><span class="pos-label">포수</span><span class="pos-name" th:text="${liveBox.catcher} ?: '-'">-</span></div>

          <div class="mound">
            <span class="mound-label">투수</span>
            <span class="mound-name" th:text="${liveBox.pitcher} ?: '-'">-</span>
          </div>
          <div class="home-plate">
            <span class="plate-label">타자</span>
            <span class="plate-name" th:text="${liveBox.currentBatter} ?: '-'">-</span>
          </div>
        </div>

        <div class="live-feed">
          <div class="live-feed-empty" th:if="${#lists.isEmpty(liveTextLines)}">아직 중계 내용이 없어요.</div>
          <div class="live-feed-line" th:each="line, iter : ${liveTextLines}"
               th:classappend="${iter.first} ? ' latest' : ''"
               th:text="${line}">문자중계 한 줄</div>
        </div>
      </div>
    </div>

    <table class="line-score-table" th:if="${hasLineScore}">
      <thead>
        <tr>
          <th style="text-align:left; padding-left:16px;">팀</th>
          <th th:each="h : ${inningHeaders}" th:text="${h}">1</th>
          <th>R</th>
          <th>H</th>
          <th>E</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="team-label" th:text="${match.awayTeam}">원정팀</td>
          <td th:each="v : ${awayInningValues}" th:text="${v}">0</td>
          <td class="total" th:text="${match.awayScore}">0</td>
          <td th:text="${match.awayHits}">0</td>
          <td th:text="${match.awayErrors}">0</td>
        </tr>
        <tr>
          <td class="team-label" th:text="${match.homeTeam}">홈팀</td>
          <td th:each="v : ${homeInningValues}" th:text="${v}">0</td>
          <td class="total" th:text="${match.homeScore}">0</td>
          <td th:text="${match.homeHits}">0</td>
          <td th:text="${match.homeErrors}">0</td>
        </tr>
      </tbody>
    </table>

    <div class="no-line-score" th:if="${!hasLineScore}">
      아직 이닝별 점수판 데이터가 없어요.
    </div>
  </div>
</main>

<div class="sport-nav">
  <div class="sport-nav-inner">
    <div class="sport-tab active">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M7 5.5C9 8 9 16 7 18.5M17 5.5C15 8 15 16 17 18.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      야구
    </div>
    <div class="sport-tab">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 8l3.5 2.5-1.3 4H9.8l-1.3-4L12 8z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 3.5v4.5M4.5 9l3.2 1.5M19.5 9l-3.2 1.5M8 19l1.8-4.5M16 19l-1.8-4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      축구
    </div>
  </div>
</div>

<script th:if="${isLive}" th:inline="javascript">
  const MATCH_ID = /*[[${match.id}]]*/ 0;
  let liveBoxPolling = /*[[${liveBox.live}]]*/ false;
  let liveBoxTimer = null;

  function setPosName(selector, name) {
    const el = document.querySelector(selector);
    if (el) el.textContent = name || '-';
  }

  function updateCountDots(selector, count) {
    const dots = document.querySelectorAll(selector + ' .dot');
    const n = count || 0;
    dots.forEach((dot, idx) => dot.classList.toggle('on', idx < n));
  }

  function applyLiveBox(data) {
    document.querySelector('.base-1b').classList.toggle('occupied', !!data.runnerOnFirst);
    document.querySelector('.base-2b').classList.toggle('occupied', !!data.runnerOnSecond);
    document.querySelector('.base-3b').classList.toggle('occupied', !!data.runnerOnThird);

    setPosName('.mound-name', data.pitcher);
    setPosName('.pos-c .pos-name', data.catcher);
    setPosName('.pos-1b .pos-name', data.firstBase);
    setPosName('.pos-2b .pos-name', data.secondBase);
    setPosName('.pos-3b .pos-name', data.thirdBase);
    setPosName('.pos-ss .pos-name', data.shortstop);
    setPosName('.pos-lf .pos-name', data.leftFielder);
    setPosName('.pos-cf .pos-name', data.centerFielder);
    setPosName('.pos-rf .pos-name', data.rightFielder);
    setPosName('.plate-name', data.currentBatter);

    updateCountDots('.count-ball', data.ballCount);
    updateCountDots('.count-strike', data.strikeCount);
    updateCountDots('.count-out', data.outCount);
  }

  async function pollLiveBox() {
    try {
      const res = await fetch('/api/matches/' + MATCH_ID + '/live-box');
      const body = await res.json();
      const data = body.data;
      if (!data) return;
      applyLiveBox(data);
      if (!data.live && liveBoxTimer) {
        clearInterval(liveBoxTimer);
        liveBoxTimer = null;
      }
    } catch (e) {
      console.error('라이브박스 갱신 실패', e);
    }
  }

  // 경기 상세 진입 시점에 이미 LIVE였던 경우에만 폴링을 시작한다. 예정/종료 경기는
  // 서버 렌더링된 마지막 상태 그대로 고정 표시한다.
  if (liveBoxPolling) {
    liveBoxTimer = setInterval(pollLiveBox, 10000);
  }
</script>

</body>
</html>
