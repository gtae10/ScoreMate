<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
  <title>ScoreMate - 순위</title>
</head>
<body>

<div class="header-stack">
  <div class="topbar">
    <a class="logo" th:href="@{/}">
      <div class="logo-mark">SM</div>
      ScoreMate
    </a>

    <nav class="primary-nav">
      <a th:href="@{/}">경기</a>
      <a class="active" th:href="@{/standings}">순위</a>
      <a th:href="@{/players}">선수</a>
      <a>즐겨찾기</a>
    </nav>

    <div class="top-actions">
      <div class="icon-btn" title="검색">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
    </div>
  </div>
</div>

<main>
  <div class="league-card">
    <div class="league-head" style="cursor:default;">
      <div class="league-head-left">
        <div class="league-badge">KBO</div>
        <div>
          <div class="league-name">KBO 리그 순위</div>
          <div class="league-sub" th:text="${season} + ' 시즌'">2026 시즌</div>
        </div>
      </div>
    </div>

    <table class="data-table">
      <thead>
        <tr>
          <th style="width:40px;">순위</th>
          <th style="text-align:left; padding-left:20px;">팀</th>
          <th>승</th>
          <th>패</th>
          <th>무</th>
          <th>승률</th>
          <th>게임차</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="s : ${standings}">
          <td class="rank-cell" th:text="${s.rank}">1</td>
          <td style="padding-left:20px;">
            <div class="team-cell">
              <div class="crest" th:style="'background:' + ${s.color}" th:text="${s.code}">SS</div>
              <span th:text="${s.teamName}">삼성</span>
            </div>
          </td>
          <td th:text="${s.wins}">0</td>
          <td th:text="${s.losses}">0</td>
          <td th:text="${s.draws}">0</td>
          <td th:text="${#numbers.formatDecimal(s.winRate, 1, 3)}">0.000</td>
          <td th:text="${s.gamesBehind}">0.0</td>
        </tr>
        <tr th:if="${#lists.isEmpty(standings)}">
          <td colspan="7" style="padding: 30px 0; color: var(--text-faint); font-family:'Inter',sans-serif;">
            아직 순위표 데이터가 없어요.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<div class="sport-nav">
  <div class="sport-nav-inner">
    <div class="sport-tab active">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M7 5.5C9 8 9 16 7 18.5M17 5.5C15 8 15 16 17 18.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      야구
    </div>
    <div class="sport-tab">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 8l3.5 2.5-1.3 4H9.8l-1.3-4L12 8z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 3.5v4.5M4.5 9l3.2 1.5M19.5 9l-3.2 1.5M8 19l1.8-4.5M16 19l-1.8-4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      축구
    </div>
  </div>
</div>

</body>
</html>
