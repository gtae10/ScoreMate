<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
  <title>ScoreMate - 전체 일정</title>
</head>
<body>

<div class="header-stack">
  <div class="topbar">
    <a class="logo" th:href="@{/}">
      <div class="logo-mark">SM</div>
      ScoreMate
    </a>

    <nav class="primary-nav">
      <a th:href="@{/}">경기</a>
      <a class="active">전체 일정</a>
      <a>순위</a>
      <a>선수</a>
    </nav>

    <div class="top-actions">
      <div class="icon-btn" title="검색">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
    </div>
  </div>
</div>

<main>
  <div class="league-sub" style="margin-bottom:16px;">
    지금까지 크롤링된 경기 총 <span th:text="${totalCount}">0</span>건
  </div>

  <div class="league-card" th:each="entry : ${groupedMatches}">
    <div class="league-head" style="cursor:default;">
      <div class="league-head-left">
        <div class="league-badge">KBO</div>
        <div>
          <div class="league-name" th:text="${entry.key}">2026-07-01</div>
          <div class="league-sub" th:text="${entry.value.size()} + '경기'">5경기</div>
        </div>
      </div>
    </div>

    <div class="match-list">
      <div class="match-row" th:each="match : ${entry.value}">
        <div class="status-badge"
             th:classappend="${match.status == 'LIVE'} ? ' live' : ''"
             th:text="${match.status == 'FINISHED' ? '종료' : (match.status == 'CANCELLED' ? '취소' : #temporals.format(match.matchDate, 'HH:mm'))}">
          종료
        </div>

        <div class="team home">
          <div class="crest" th:text="${#strings.substring(match.homeTeam, 0, 1)}">팀</div>
          <span th:text="${match.homeTeam}">홈팀</span>
        </div>

        <div class="score-box" th:if="${match.homeScore != null}">
          <span class="n" th:classappend="${match.homeScore < match.awayScore} ? ' lose' : ''" th:text="${match.homeScore}">0</span>
          <span class="dash">–</span>
          <span class="n" th:classappend="${match.awayScore < match.homeScore} ? ' lose' : ''" th:text="${match.awayScore}">0</span>
        </div>
        <div class="score-box" th:if="${match.homeScore == null}">
          <span class="dash">– : –</span>
        </div>

        <div class="team away">
          <div class="crest" th:text="${#strings.substring(match.awayTeam, 0, 1)}">팀</div>
          <span th:text="${match.awayTeam}">원정팀</span>
        </div>
      </div>
    </div>
  </div>

  <div class="league-sub" th:if="${totalCount == 0}" style="text-align:center; padding: 40px 0;">
    아직 크롤링된 경기가 없어요.
  </div>
</main>

<div class="sport-nav">
  <div class="sport-nav-inner">
    <div class="sport-tab active">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M7 5.5C9 8 9 16 7 18.5M17 5.5C15 8 15 16 17 18.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      야구
    </div>
    <div class="sport-tab">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 8l3.5 2.5-1.3 4H9.8l-1.3-4L12 8z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 3.5v4.5M4.5 9l3.2 1.5M19.5 9l-3.2 1.5M8 19l1.8-4.5M16 19l-1.8-4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      축구
    </div>
  </div>
</div>

</body>
</html>
