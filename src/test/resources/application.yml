spring:
  application:
    name: ScoreMate

  datasource:
    url: jdbc:h2:mem:scoremate-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

jwt:
  secret: test-only-secret-key-do-not-use-in-production-min-32-bytes
  expiration-ms: 3600000